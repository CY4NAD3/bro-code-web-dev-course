<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span and Div</title>
</head>
<body>
    <!-- GROUP TOGETHER HTML -->
    <!--<span> inline container to group elements for styling purposes -->
    <!-- <div> block container to group elements for styling purposes -->

    <h1><span style="background-color: tomato;">This is a span title</span></h1>
    <h1><div style="background-color: cyan;">This is a div title</div></h1>

    <p>This is a span sentence</p>
    <p>This is a div sentence</p>
</body>
</html>
